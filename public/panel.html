<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KryonHost Control Panel</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: #05050a; color: #fff; font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; overflow-x: hidden; }
    /* Sidebar */
    .sidebar { width: 260px; background: #0a0914; border-right: 1px solid var(--rim); display: flex; flex-direction: column; }
    .sidebar-brand { padding: 24px; border-bottom: 1px solid var(--rim); font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
    .sidebar-nav { flex: 1; padding: 20px 10px; display: flex; flex-direction: column; gap: 5px; }
    .sidebar-link { padding: 12px 16px; border-radius: 8px; color: var(--muted2); text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; transition: 0.2s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,0.05); color: #fff; }
    .sidebar-link svg { width: 18px; height: 18px; }
    
    /* Main Content */
    .main-content { flex: 1; padding: 40px; display: flex; flex-direction: column; max-height: 100vh; overflow-y: auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .page-title { font-family: 'Bricolage Grotesque', sans-serif; font-size: 2rem; font-weight: 400; }
    
    /* Server List */
    .server-list { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .server-card { background: #11101a; border: 1px solid var(--rim); border-radius: 12px; padding: 20px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
    .server-card:hover { border-color: rgba(124,106,255,0.4); transform: translateY(-3px); }
    .server-status-indicator { position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
    .status-running { background: #22c55e; }
    .status-stopped { background: #ef4444; }
    .server-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    .server-ip { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--muted); margin-bottom: 15px; }
    .server-specs { font-size: 0.8rem; color: var(--muted2); display: flex; gap: 10px; }
    
    /* Server Detail View */
    #detail-view { display: none; }
    .detail-header { background: #11101a; border: 1px solid var(--rim); border-radius: 12px; padding: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .power-actions { display: flex; gap: 10px; }
    .btn-power { padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; border: 1px solid; background: transparent; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn-start { color: #22c55e; border-color: rgba(34,197,94,0.3); } .btn-start:hover { background: rgba(34,197,94,0.1); }
    .btn-stop { color: #ef4444; border-color: rgba(239,68,68,0.3); } .btn-stop:hover { background: rgba(239,68,68,0.1); }
    .btn-restart { color: #f59e0b; border-color: rgba(245,158,11,0.3); } .btn-restart:hover { background: rgba(245,158,11,0.1); }
    
    /* Stats & Console Grid */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel-box { background: #11101a; border: 1px solid var(--rim); border-radius: 12px; padding: 20px; }
    .panel-box-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
    .stat-row:last-child { border-bottom: none; }
    
    /* Terminal */
    .terminal-window { background: #05050a; border: 1px solid var(--rim); border-radius: 8px; padding: 16px; font-family: 'DM Mono', monospace; font-size: 0.75rem; color: #a78bfa; height: 300px; overflow-y: auto; line-height: 1.5; white-space: pre-wrap; }
    
    /* Back button */
    .btn-back { background: transparent; border: none; color: var(--muted); font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 20px; padding: 0; }
    .btn-back:hover { color: #fff; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--purple-bright)" stroke-width="2.2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
      KryonPanel
    </div>
    <div class="sidebar-nav">
      <a href="#" class="sidebar-link active" onclick="showListView()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        My Servers
      </a>
      <a href="https://discord.gg/kryonhost" target="_blank" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Support on Discord
      </a>
      <a href="/" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Website
      </a>
    </div>
    <div class="sidebar-user">
      <div style="margin-bottom:4px;">Logged in as</div>
      <div class="user-email" id="u-email">Loading...</div>
      <button onclick="handleLogout()" style="margin-top:10px; background:transparent; border:1px solid rgba(255,255,255,0.1); color:var(--muted); font-size:0.75rem; padding:6px 12px; border-radius:6px; cursor:pointer; width:100%; transition:0.2s;" onmouseover="this.style.borderColor='#ef4444';this.style.color='#ef4444'" onmouseout="this.style.borderColor='rgba(255,255,255,0.1)';this.style.color='var(--muted)'">Sign Out</button>
    </div>
  </div>

  <div class="main-content">
    
    <!-- LIST VIEW -->
    <div id="list-view">
      <div class="top-bar">
        <h1 class="page-title">Active Services</h1>
        <button class="btn btn-primary" onclick="window.location.href='/#plans-section'">+ New Server</button>
      </div>
      
      <div class="server-list" id="servers-container">
        <!-- Rendered via JS -->
        <div style="color:var(--muted); font-size:0.9rem;">Loading servers...</div>
      </div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="detail-view">
      <button class="btn-back" onclick="showListView()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Servers
      </button>
      
      <div class="detail-header">
        <div>
          <h2 class="page-title" id="d-name" style="margin-bottom:8px; font-size:1.8rem;">Loading...</h2>
          <div style="font-family:'DM Mono',monospace; color:var(--muted); font-size:0.9rem;" id="d-ip">...</div>
        </div>
        <div class="power-actions">
          <button class="btn-power btn-start" onclick="powerAction('start')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg> Start
          </button>
          <button class="btn-power btn-restart" onclick="powerAction('restart')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Restart
          </button>
          <button class="btn-power btn-stop" onclick="powerAction('stop')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg> Stop
          </button>
        </div>
      </div>

      <div class="dashboard-grid">
        <!-- Stats -->
        <div class="panel-box">
          <div class="panel-box-title">System Metrics</div>
          <div class="stat-row">
            <span style="color:var(--muted2);">Status</span>
            <span id="d-status" style="font-weight:600; text-transform:uppercase;">...</span>
          </div>
          <div class="stat-row">
            <span style="color:var(--muted2);">CPU Usage</span>
            <span id="d-cpu">...</span>
          </div>
          <div class="stat-row">
            <span style="color:var(--muted2);">Memory Usage</span>
            <span id="d-ram">...</span>
          </div>
          <div class="stat-row">
            <span style="color:var(--muted2);">Storage Usage</span>
            <span id="d-disk">...</span>
          </div>
          <div class="stat-row">
            <span style="color:var(--muted2);">Operating System</span>
            <span id="d-os">...</span>
          </div>
        </div>

        <!-- Serial Console -->
        <div class="panel-box">
          <div class="panel-box-title">Serial Console <button class="btn-ghost" style="float:right; padding:2px 8px; font-size:0.7rem; border-radius:4px; border:1px solid var(--rim);" onclick="refreshConsole()">Refresh</button></div>
          <div class="terminal-window" id="d-console">Loading system logs...</div>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/panel.js"></script>
  <script src="/js/supabase-config.js"></script>
  <script>
    const adminEmail = "admin@kryonhost.com";
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = "/login";
      else {
        const uEmail = document.getElementById("u-email");
        if (uEmail) uEmail.textContent = session.user.email;
      }
    });
    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.href = "/login";
    }
  </script>
<script src="/js/panel.js"></script>
</body>
</html>

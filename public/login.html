<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KryonHost — Client Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #05050a; color: #fff; font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; flex-direction: column; }
    .login-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-box { background: #0a0914; border: 1px solid var(--rim); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .login-title { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.8rem; margin-bottom: 8px; text-align: center; }
    .login-sub { color: var(--muted2); font-size: 0.9rem; margin-bottom: 30px; text-align: center; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
    .input-group input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #11101a; color: #fff; font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.2s; box-sizing: border-box; }
    .input-group input:focus { border-color: var(--purple-bright); box-shadow: 0 0 0 3px rgba(124,106,255,0.1); }
    .login-btn { width: 100%; padding: 14px; background: var(--purple-bright); border: 1px solid var(--purple-bright); border-radius: 8px; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .login-btn:hover { background: #6855e0; }
    .btn-secondary { background: transparent; border: 1px solid var(--rim); margin-top: 10px; }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }
    #auth-msg { margin-top: 15px; font-size: 0.85rem; text-align: center; }
    .err-msg { color: #ef4444; }
    .succ-msg { color: #22c55e; }
  </style>
</head>
<body>
  
  <header class="navbar">
    <div class="wrap" style="display:flex; justify-content:space-between; align-items:center;">
      <a href="/" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
        <img src="/images/logo.jpg" alt="KryonHost" style="width:28px;height:28px;object-fit:contain;border-radius:5px;">
        <span style="font-family:'Bricolage Grotesque',sans-serif; font-size:1.25rem; font-weight:600; color:#fff;">KryonHost</span>
      </a>
      <a href="/" class="btn btn-ghost btn-sm">Return to Website</a>
    </div>
  </header>

  <div class="login-container">
    <div class="login-box">
      <h2 class="login-title">Welcome Back</h2>
      <p class="login-sub">Log in to manage your infrastructure.</p>
      
      <form id="login-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="client@example.com" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="login-btn" id="btn-login">Secure Login</button>
        <button type="button" class="login-btn btn-secondary" id="btn-signup">Create Account</button>
      </form>
      
      <div id="auth-msg"></div>
    </div>
  </div>

  <script src="/js/supabase-config.js"></script>
  <script>
    const authMsg = document.getElementById('auth-msg');
    const adminEmail = 'admin@kryonhost.com'; // Set your admin email here

    async function handleAuth(action) {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        authMsg.className = 'err-msg';
        authMsg.textContent = 'Please enter both email and password.';
        return;
      }

      authMsg.className = '';
      authMsg.textContent = 'Processing...';

      let error = null;
      let session = null;

      if (action === 'signup') {
        const res = await supabaseClient.auth.signUp({ email, password });
        error = res.error;
        session = res.data.session;
        if (!error) {
          authMsg.className = 'succ-msg';
          authMsg.innerHTML = 'Account created successfully!<br>Please check your email to verify (if required by Supabase).';
          return; // Wait for them to verify or log in
        }
      } else {
        const res = await supabaseClient.auth.signInWithPassword({ email, password });
        error = res.error;
        session = res.data.session;
      }

      if (error) {
        authMsg.className = 'err-msg';
        authMsg.textContent = error.message;
      } else if (session) {
        // Logged in successfully
        authMsg.className = 'succ-msg';
        authMsg.textContent = 'Login successful! Redirecting...';
        
        if (session.user.email === adminEmail) {
          window.location.href = '/admin';
        } else {
          window.location.href = '/panel';
        }
      }
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      handleAuth('login');
    });

    document.getElementById('btn-signup').addEventListener('click', () => {
      handleAuth('signup');
    });
    
    // Check if already logged in
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        if (session.user.email === adminEmail) window.location.href = '/admin';
        else window.location.href = '/panel';
      }
    });
  </script>
</body>
</html>
